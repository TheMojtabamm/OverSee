name: Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Windows platform files
        run: flutter create --platforms=windows --org com.oversea .

      - name: Get packages
        run: flutter pub get

      - name: Build Windows (release)
        run: flutter build windows --release --dart-define=LOCK_P1=${{ secrets.LOCK_P1 }} --dart-define=LOCK_P2=${{ secrets.LOCK_P2 }} --dart-define=LOCK_P3=${{ secrets.LOCK_P3 }} --dart-define=LOCK_P4=${{ secrets.LOCK_P4 }} --dart-define=AD_INTERSTITIAL_ID=${{ secrets.AD_INTERSTITIAL_ID }}

      - name: Package release folder
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath oversea-windows.zip

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: oversea-windows
          path: oversea-windows.zip
