name: Emulator smoke test

# Builds the release-configured app (R8, obfuscation, native lock core) for x86_64 and
# launches it on an Android emulator. Fails with the crash log if it doesn't stay up.
on:
  workflow_dispatch:
    inputs:
      api:
        description: "Android API level of the emulator"
        default: "36"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Build Xray AAR (libv2ray)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$(ls "$ANDROID_HOME/ndk" | sort -V | tail -1)"
          tool/build_xray_aar.sh
      - run: flutter pub get
      - name: Mask throwaway lock secrets (same path as a release)
        env:
          LOCK_P1: aaaaaaaaaaaaaaaa
          LOCK_P2: bbbbbbbbbbbbbbbb
          LOCK_P3: cccccccccccccccc
          LOCK_P4: dddddddddddddddd
          GATE_KEY: smoke-test-gate-key
        run: dart run tool/mask_secrets.dart >> "$GITHUB_ENV"
      - name: Build APK (release config, x86_64)
        run: >
          flutter build apk --release --target-platform android-x64
          --obfuscate --split-debug-info=build/symbols
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: tool/emulator_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-logs
          path: build/smoke
          retention-days: 7
