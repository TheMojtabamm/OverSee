name: VPN data-path e2e

# Starts the real VpnService + Xray tun on an Android emulator against a local Xray server and
# checks that DNS and TCP flow through the tunnel and that the UI is told "connected".
on:
  workflow_dispatch:
    inputs:
      api:
        description: "Android API level of the emulator"
        default: "36"
  push:
    branches: [main]
    paths: ["integration_test/**", "tool/vpn_e2e.sh", ".github/workflows/vpn-e2e.yml", "android/app/src/**", "lib/data/tunnel_service.dart", "lib/domain/xray_config_builder.dart"]

jobs:
  vpn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Build Xray AAR (libv2ray)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$(ls "$ANDROID_HOME/ndk" | sort -V | tail -1)"
          tool/build_xray_aar.sh
      - run: flutter pub get
      - name: Build the Xray server
        working-directory: tool/validate_xray_config
        run: GOFLAGS=-mod=mod go build -o "$RUNNER_TEMP/xray" github.com/xtls/xray-core/main
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api || '36' }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: XRAY="$RUNNER_TEMP/xray" tool/vpn_e2e.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vpn-e2e-logs
          path: build/vpn_e2e
          retention-days: 7
