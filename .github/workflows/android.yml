name: Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Platform folders are not committed (see README); CI generates them so
      # they always match the runner's Flutter version.
      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.oversea .

      # Current plugin versions require compileSdk up to 36; minSdk 24 = Android 7+.
      # The compileSdk bump only affects compilation, not minimum supported devices.
      - name: Set SDK versions (minSdk 24, compileSdk 36)
        run: |
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' \
            android/app/build.gradle android/app/build.gradle.kts 2>/dev/null || true
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' \
            android/app/build.gradle.kts 2>/dev/null || true
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' \
            android/app/build.gradle 2>/dev/null || true
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts || true
          fi
          grep -rn "minSdk\|compileSdk" android/app/ || true

      - name: Get packages
        run: flutter pub get

      # LOCK_CLIENT_KEY is injected here from a repo secret and is never stored in
      # the source tree. --obfuscate raises the bar on reversing the release binary.
      # NOTE: until the LOCK_CLIENT_KEY secret is configured in the repo, CI falls
      # back to the shared dev key so builds are consistent and installable.
      - name: Build APK (release)
        run: >
          flutter build apk --release
          --dart-define=LOCK_CLIENT_KEY=${{ secrets.LOCK_CLIENT_KEY || '0293fc78ffeaf2c46ab8f3bca7c92fffcb1345d8be7ec1cdc2e838772a75d5c9' }}
          --obfuscate --split-debug-info=build/symbols

      - name: Build App Bundle (release, for Google Play)
        run: >
          flutter build appbundle --release
          --dart-define=LOCK_CLIENT_KEY=${{ secrets.LOCK_CLIENT_KEY || '0293fc78ffeaf2c46ab8f3bca7c92fffcb1345d8be7ec1cdc2e838772a75d5c9' }}
          --obfuscate --split-debug-info=build/symbols

      # Re-sign the APK with the stable release key (from secrets), or a throwaway
      # key if none is set, so the produced APK is always installable.
      - name: Sign APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.jks
          else
            KS_PASS=throwaway; KEY_ALIAS=oversea; KEY_PASS=throwaway
            keytool -genkeypair -v -keystore release.jks -storetype PKCS12 \
              -storepass "$KS_PASS" -keypass "$KEY_PASS" -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Oversea, O=Oversea"
          fi
          BT=$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign \
            --ks release.jks --ks-pass "pass:$KS_PASS" \
            --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASS" \
            --out oversea-release.apk \
            build/app/outputs/flutter-apk/app-release.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --verbose oversea-release.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: oversea-apk
          path: oversea-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: oversea-aab
          path: build/app/outputs/bundle/release/app-release.aab
