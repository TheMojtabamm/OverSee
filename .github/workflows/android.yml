name: Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable

      # Xray-core is built from a pinned source version (no prebuilt binary).
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Build Xray AAR (libv2ray)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$(ls "$ANDROID_HOME/ndk" | sort -V | tail -1)"
          tool/build_xray_aar.sh

      # The signing certificate must be known BEFORE the build: the app compares its own
      # certificate with EXPECTED_CERTS and silently stops opening locked files if it was
      # re-signed (repackaged). Add PLAY_CERT_SHA256 (Play Console → App integrity →
      # App signing key certificate, SHA-256, hex without colons) for Play installs.
      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS_S: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS_S: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS_S: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_CERT: ${{ secrets.PLAY_CERT_SHA256 }}
        run: |
          set -e
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.jks
            KS_PASS="$KS_PASS_S"; KEY_ALIAS="$KEY_ALIAS_S"; KEY_PASS="$KEY_PASS_S"
          else
            KS_PASS=throwaway; KEY_ALIAS=oversea; KEY_PASS=throwaway
            keytool -genkeypair -keystore release.jks -storetype PKCS12 \
              -storepass "$KS_PASS" -keypass "$KEY_PASS" -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Oversea, O=Oversea"
          fi
          CERT=$(keytool -list -v -keystore release.jks -storepass "$KS_PASS" -alias "$KEY_ALIAS" \
                 | awk -F'SHA256: ' '/SHA256:/{gsub(":","",$2); print tolower($2); exit}')
          [ -n "$CERT" ] || { echo "could not read certificate fingerprint"; exit 1; }
          {
            echo "KS_PASS=$KS_PASS"; echo "KEY_ALIAS=$KEY_ALIAS"; echo "KEY_PASS=$KEY_PASS"
            echo "EXPECTED_CERTS=$CERT${PLAY_CERT:+,$PLAY_CERT}"
          } >> "$GITHUB_ENV"

      - name: Get packages
        run: flutter pub get

      # LOCK_P1..P4 are injected here from a repo secret and is never stored in
      # the source tree. --obfuscate raises the bar on reversing the release binary.
      - name: Build APK (release)
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: >
          flutter build apk --release
          --dart-define=LOCK_P1=${{ secrets.LOCK_P1 }} --dart-define=LOCK_P2=${{ secrets.LOCK_P2 }} --dart-define=LOCK_P3=${{ secrets.LOCK_P3 }} --dart-define=LOCK_P4=${{ secrets.LOCK_P4 }} --dart-define=GATE_KEY=${{ secrets.GATE_KEY }} --dart-define=EXPECTED_CERTS=${{ env.EXPECTED_CERTS }} --dart-define=AD_INTERSTITIAL_ID=${{ secrets.AD_INTERSTITIAL_ID }} --dart-define=AD_BANNER_ID=${{ secrets.AD_BANNER_ID }}
          --obfuscate --split-debug-info=build/symbols

      - name: Build App Bundle (release, for Google Play)
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: >
          flutter build appbundle --release
          --dart-define=LOCK_P1=${{ secrets.LOCK_P1 }} --dart-define=LOCK_P2=${{ secrets.LOCK_P2 }} --dart-define=LOCK_P3=${{ secrets.LOCK_P3 }} --dart-define=LOCK_P4=${{ secrets.LOCK_P4 }} --dart-define=GATE_KEY=${{ secrets.GATE_KEY }} --dart-define=EXPECTED_CERTS=${{ env.EXPECTED_CERTS }} --dart-define=AD_INTERSTITIAL_ID=${{ secrets.AD_INTERSTITIAL_ID }} --dart-define=AD_BANNER_ID=${{ secrets.AD_BANNER_ID }}
          --obfuscate --split-debug-info=build/symbols

      # Re-sign the APK with the stable release key (from secrets), or a throwaway
      # key if none is set, so the produced APK is always installable.
      - name: Sign APK
        run: |
          set -e
          BT=$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign \
            --ks release.jks --ks-pass "pass:$KS_PASS" \
            --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASS" \
            --out oversea-release.apk \
            build/app/outputs/flutter-apk/app-release.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --verbose oversea-release.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: oversea-apk
          path: oversea-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: oversea-aab
          path: build/app/outputs/bundle/release/app-release.aab
