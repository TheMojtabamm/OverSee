name: Release

# Push a tag like v1.0 to build signed artifacts and publish a GitHub Release.
#   git tag v1.0 && git push origin v1.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # needed to create the Release and upload assets

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable

      # Xray-core is built from a pinned source version (no prebuilt binary).
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Build Xray AAR (libv2ray)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$(ls "$ANDROID_HOME/ndk" | sort -V | tail -1)"
          tool/build_xray_aar.sh

      - run: flutter pub get

      - name: Build APK (release)
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: >
          flutter build apk --release
          --dart-define=LOCK_P1=${{ secrets.LOCK_P1 }} --dart-define=LOCK_P2=${{ secrets.LOCK_P2 }} --dart-define=LOCK_P3=${{ secrets.LOCK_P3 }} --dart-define=LOCK_P4=${{ secrets.LOCK_P4 }} --dart-define=GATE_KEY=${{ secrets.GATE_KEY }} --dart-define=AD_INTERSTITIAL_ID=${{ secrets.AD_INTERSTITIAL_ID }}
          --obfuscate --split-debug-info=build/symbols

      # Re-sign with a stable release key (from secrets). If the secret is not set,
      # fall back to a throwaway key so the APK is still installable for testing.
      - name: Sign APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.jks
          else
            echo "No keystore secret set — generating a throwaway key (install-only)."
            KS_PASS=throwaway; KEY_ALIAS=oversea; KEY_PASS=throwaway
            keytool -genkeypair -v -keystore release.jks -storetype PKCS12 \
              -storepass "$KS_PASS" -keypass "$KEY_PASS" -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Oversea, O=Oversea"
          fi
          BT=$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign \
            --ks release.jks --ks-pass "pass:$KS_PASS" \
            --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASS" \
            --out oversea-${{ github.ref_name }}.apk \
            build/app/outputs/flutter-apk/app-release.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --verbose oversea-${{ github.ref_name }}.apk

      - name: Publish Release with the raw APK
        uses: softprops/action-gh-release@v2
        with:
          files: oversea-${{ github.ref_name }}.apk
          generate_release_notes: true

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
      - name: Generate Windows platform files
        run: flutter create --platforms=windows --org com.oversea .
      - run: flutter pub get
      - name: Build Windows (release)
        run: flutter build windows --release --dart-define=LOCK_P1=${{ secrets.LOCK_P1 }} --dart-define=LOCK_P2=${{ secrets.LOCK_P2 }} --dart-define=LOCK_P3=${{ secrets.LOCK_P3 }} --dart-define=LOCK_P4=${{ secrets.LOCK_P4 }} --dart-define=GATE_KEY=${{ secrets.GATE_KEY }} --dart-define=AD_INTERSTITIAL_ID=${{ secrets.AD_INTERSTITIAL_ID }}
      - name: Package release folder
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath oversea-${{ github.ref_name }}-windows.zip
      - name: Attach Windows build to the Release
        uses: softprops/action-gh-release@v2
        with:
          files: oversea-${{ github.ref_name }}-windows.zip
