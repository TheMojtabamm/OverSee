name: Release

# Push a tag like v1.0 to build signed artifacts and publish a GitHub Release.
#   git tag v1.0 && git push origin v1.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # needed to create the Release and upload assets

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.oversea .

      # Pin compileSdk=36 and minSdk=24. The app build.gradle.kts is fully
      # replaced; the ROOT build.gradle.kts is replaced with a committed version
      # that preserves Flutter's standard root config and adds a subprojects
      # compileSdk override (so plugin modules like share_plus compile at 36).
      # flutter create still provides the Gradle wrapper jar, MainActivity, and
      # resources.
      - name: Pin SDK versions (minSdk 24, compileSdk 36)
        run: |
          cp .github/android/app-build.gradle.kts android/app/build.gradle.kts
          if [ -f android/build.gradle.kts ]; then
            cp .github/android/build.gradle.kts android/build.gradle.kts
          fi
          grep -rhn "compileSdk\|minSdk" android/build.gradle* android/app/build.gradle.kts || true

      # AdMob requires an application-id meta-data in the manifest. Defaults to
      # Google's public *test* app id unless the ADMOB_APP_ID secret is set.
      - name: Inject AdMob app id into manifest
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: |
          ID="${ADMOB_APP_ID:-ca-app-pub-3940256099942544~3347511713}"
          python3 - "$ID" <<'PY'
          import sys
          p="android/app/src/main/AndroidManifest.xml"
          s=open(p).read()
          meta='<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="%s"/>' % sys.argv[1]
          if "gms.ads.APPLICATION_ID" not in s:
              s=s.replace("<application", "<application",1)
              i=s.index(">", s.index("<application"))+1
              s=s[:i]+"\n        "+meta+s[i:]
          open(p,"w").write(s)
          PY

      - run: flutter pub get

      - name: Build APK (release)
        run: >
          flutter build apk --release
          --dart-define=LOCK_P1=${{ secrets.LOCK_P1 }} --dart-define=LOCK_P2=${{ secrets.LOCK_P2 }} --dart-define=LOCK_P3=${{ secrets.LOCK_P3 }} --dart-define=LOCK_P4=${{ secrets.LOCK_P4 }} --dart-define=AD_INTERSTITIAL_ID=${{ secrets.AD_INTERSTITIAL_ID }}
          --obfuscate --split-debug-info=build/symbols

      # Re-sign with a stable release key (from secrets). If the secret is not set,
      # fall back to a throwaway key so the APK is still installable for testing.
      - name: Sign APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.jks
          else
            echo "No keystore secret set — generating a throwaway key (install-only)."
            KS_PASS=throwaway; KEY_ALIAS=oversea; KEY_PASS=throwaway
            keytool -genkeypair -v -keystore release.jks -storetype PKCS12 \
              -storepass "$KS_PASS" -keypass "$KEY_PASS" -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Oversea, O=Oversea"
          fi
          BT=$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign \
            --ks release.jks --ks-pass "pass:$KS_PASS" \
            --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASS" \
            --out oversea-${{ github.ref_name }}.apk \
            build/app/outputs/flutter-apk/app-release.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --verbose oversea-${{ github.ref_name }}.apk

      - name: Publish Release with the raw APK
        uses: softprops/action-gh-release@v2
        with:
          files: oversea-${{ github.ref_name }}.apk
          generate_release_notes: true

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Windows platform files
        run: flutter create --platforms=windows --org com.oversea .
      - run: flutter pub get
      - name: Build Windows (release)
        run: flutter build windows --release --dart-define=LOCK_P1=${{ secrets.LOCK_P1 }} --dart-define=LOCK_P2=${{ secrets.LOCK_P2 }} --dart-define=LOCK_P3=${{ secrets.LOCK_P3 }} --dart-define=LOCK_P4=${{ secrets.LOCK_P4 }} --dart-define=AD_INTERSTITIAL_ID=${{ secrets.AD_INTERSTITIAL_ID }}
      - name: Package release folder
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath oversea-${{ github.ref_name }}-windows.zip
      - name: Attach Windows build to the Release
        uses: softprops/action-gh-release@v2
        with:
          files: oversea-${{ github.ref_name }}-windows.zip
