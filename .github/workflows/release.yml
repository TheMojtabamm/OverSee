name: Release

# Push a tag like v1.0 to build the signed APK and publish a GitHub Release.
#   git tag v1.0 && git push origin v1.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      test_build:
        description: "Test build: skip the AdMob check, keep the APK as a build artifact (no Release)"
        type: boolean
        default: true
      tag:
        description: "Also publish a GitHub Release with this tag (e.g. v1.0-beta.9). Empty = artifact only"
        type: string
        default: ""

permissions:
  contents: write # needed to create the Release and upload assets

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Name and version of the APK
        env:
          TAG: ${{ inputs.tag != '' && inputs.tag || (github.ref_type == 'tag' && github.ref_name || '') }}
        run: |
          if [ -n "$TAG" ]; then NAME="$TAG"; VER="${TAG#v}"; else NAME="test-${{ github.run_number }}"; VER="1.0.0-test.${{ github.run_number }}"; fi
          echo "APK_NAME=oversea-$NAME.apk" >> "$GITHUB_ENV"
          # An increasing versionCode, so every build installs over the previous one
          # (Android refuses a lower or equal versionCode).
          echo "BUILD_NUMBER=$((100 + ${{ github.run_number }}))" >> "$GITHUB_ENV"
          echo "BUILD_NAME=$VER" >> "$GITHUB_ENV"

      # A published Release must have a working lock: refuse early (before the 10-minute
      # build) if the lock/gate secrets are missing.
      - name: Require lock secrets for a published release
        if: ${{ github.ref_type == 'tag' || inputs.tag != '' }}
        env:
          LOCK_P1: ${{ secrets.LOCK_P1 }}
          LOCK_P2: ${{ secrets.LOCK_P2 }}
          LOCK_P3: ${{ secrets.LOCK_P3 }}
          LOCK_P4: ${{ secrets.LOCK_P4 }}
          GATE_KEY: ${{ secrets.GATE_KEY }}
        run: |
          fail=0
          for v in LOCK_P1 LOCK_P2 LOCK_P3 LOCK_P4 GATE_KEY; do
            [ -n "${!v}" ] || { echo "::error::repository secret $v is missing"; fail=1; }
          done
          exit $fail

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable

      # Xray-core is built from a pinned source version (no prebuilt binary).
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Build Xray AAR (libv2ray)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$(ls "$ANDROID_HOME/ndk" | sort -V | tail -1)"
          tool/build_xray_aar.sh

      # The signing certificate must be known BEFORE the build: the app compares its own
      # certificate with EXPECTED_CERTS and silently stops opening locked files if it was
      # re-signed (repackaged). Add PLAY_CERT_SHA256 (Play Console → App integrity →
      # App signing key certificate, SHA-256, hex without colons) for Play installs.
      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS_S: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS_S: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS_S: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_CERT: ${{ secrets.PLAY_CERT_SHA256 }}
        run: |
          set -e
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.jks
            KS_PASS="$KS_PASS_S"; KEY_ALIAS="$KEY_ALIAS_S"; KEY_PASS="$KEY_PASS_S"
          else
            KS_PASS=throwaway; KEY_ALIAS=oversea; KEY_PASS=throwaway
            keytool -genkeypair -keystore release.jks -storetype PKCS12 \
              -storepass "$KS_PASS" -keypass "$KEY_PASS" -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Oversea, O=Oversea"
          fi
          CERT=$(keytool -list -v -keystore release.jks -storepass "$KS_PASS" -alias "$KEY_ALIAS" \
                 | awk -F'SHA256: ' '/SHA256:/{gsub(":","",$2); print tolower($2); exit}')
          [ -n "$CERT" ] || { echo "could not read certificate fingerprint"; exit 1; }
          {
            echo "KS_PASS=$KS_PASS"; echo "KEY_ALIAS=$KEY_ALIAS"; echo "KEY_PASS=$KEY_PASS"
            echo "EXPECTED_CERTS=$CERT${PLAY_CERT:+,$PLAY_CERT}"
          } >> "$GITHUB_ENV"

      - run: flutter pub get

      # Secrets are embedded as hex(secret XOR a fresh per-build mask), never as literals
      # (verified with `strings` on the built libapp.so). Writes LOCK_Pn_M, GATE_KEY_M, LOCK_MASK.
      - name: Mask embedded secrets
        env:
          LOCK_P1: ${{ secrets.LOCK_P1 }}
          LOCK_P2: ${{ secrets.LOCK_P2 }}
          LOCK_P3: ${{ secrets.LOCK_P3 }}
          LOCK_P4: ${{ secrets.LOCK_P4 }}
          GATE_KEY: ${{ secrets.GATE_KEY }}
        run: dart run tool/mask_secrets.dart >> "$GITHUB_ENV"

      # A release without real AdMob IDs would serve Google's *test* ads and earn nothing.
      # Tags containing "-test" (e.g. v1.0.0-test1) skip this check and are published as pre-releases.
      - name: Require real AdMob IDs
        if: ${{ !contains(github.ref_name, '-test') && inputs.test_build != true }}
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          AD_INTERSTITIAL_ID: ${{ secrets.AD_INTERSTITIAL_ID }}
          AD_BANNER_ID: ${{ secrets.AD_BANNER_ID }}
        run: |
          fail=0
          for v in ADMOB_APP_ID AD_INTERSTITIAL_ID AD_BANNER_ID; do
            val="${!v}"
            case "$val" in
              ca-app-pub-3940256099942544*) echo "::error::$v is Google's test ID"; fail=1;;
              ca-app-pub-*) ;;
              *) echo "::error::$v is missing (add it as a repository secret)"; fail=1;;
            esac
          done
          exit $fail

      - name: Build APK (release)
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: >
          flutter build apk --release --target-platform android-arm64
          --build-number=${{ env.BUILD_NUMBER }} --build-name=${{ env.BUILD_NAME }}
          --dart-define=EXPECTED_CERTS=${{ env.EXPECTED_CERTS }} --dart-define=AD_INTERSTITIAL_ID=${{ secrets.AD_INTERSTITIAL_ID }} --dart-define=AD_BANNER_ID=${{ secrets.AD_BANNER_ID }}
          --obfuscate --split-debug-info=build/symbols

      - name: Verify no secret is a plain string in the APK
        env:
          LOCK_P1: ${{ secrets.LOCK_P1 }}
          LOCK_P2: ${{ secrets.LOCK_P2 }}
          LOCK_P3: ${{ secrets.LOCK_P3 }}
          LOCK_P4: ${{ secrets.LOCK_P4 }}
          GATE_KEY: ${{ secrets.GATE_KEY }}
        run: |
          if [ -z "$LOCK_P1$LOCK_P2$LOCK_P3$LOCK_P4$GATE_KEY" ] && [ "${{ inputs.test_build }}" = true ]; then
            echo "::warning::LOCK_P1..P4 / GATE_KEY are not set: this test APK cannot open locked files (it fails closed)."
            exit 0
          fi
          tool/verify_apk_secrets.sh build/app/outputs/flutter-apk/app-release.apk

      # Re-sign with a stable release key (from secrets). If the secret is not set,
      # fall back to a throwaway key so the APK is still installable for testing.
      - name: Sign APK
        run: |
          set -e
          BT=$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign \
            --ks release.jks --ks-pass "pass:$KS_PASS" \
            --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASS" \
            --out ${{ env.APK_NAME }} \
            build/app/outputs/flutter-apk/app-release.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --verbose ${{ env.APK_NAME }}

      - name: Keep the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}
          retention-days: 14

      - name: Publish Release with the raw APK
        if: ${{ github.ref_type == 'tag' || inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" "$APK_NAME" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --latest --title "$TAG" --generate-notes \
            || gh release upload "$TAG" "$APK_NAME" --clobber --repo "$GITHUB_REPOSITORY"
