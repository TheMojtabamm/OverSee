name: Server release

# Publishes the `oversee` binaries + install.sh.
#   * every push to main that touches server/**  ->  the rolling release `server-latest`
#     (this is what the one-line installer downloads, so it always gets the newest server);
#   * a tag `server-v1.2.3`                      ->  a pinned release (OVERSEE_VERSION=server-v1.2.3);
#   * manual run                                 ->  the rolling release from the chosen ref.
on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/server-release.yml"]
    tags: ["server-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - run: go vet ./... && go test ./...
      - name: Build
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then VER="$GITHUB_REF_NAME"; else VER="server-latest-${GITHUB_SHA::7}"; fi
          mkdir -p dist
          for ARCH in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$ARCH go build -trimpath \
              -ldflags "-s -w -X main.version=$VER" -o dist/oversee-linux-$ARCH ./cmd/oversee
            (cd dist && sha256sum oversee-linux-$ARCH > oversee-linux-$ARCH.sha256)
          done
          cp install.sh dist/install.sh
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            TAG="$GITHUB_REF_NAME"; LATEST=false
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --latest=$LATEST \
              --title "Server $TAG" --notes "oversee gate manager" \
              || gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            # Rolling release: recreate it so the tag moves to this commit. It is never marked
            # "latest", so it can't hijack /releases/latest (that belongs to the app release).
            TAG=server-latest
            gh release delete "$TAG" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --latest=false --prerelease=false --title "Server (latest)" \
              --notes "Rolling build of the oversee gate manager from $GITHUB_SHA. Install: see README."
          fi
