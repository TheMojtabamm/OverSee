name: Server release

# Tag `server-v1.0.0` to publish the `oversee` binaries + install.sh as release assets.
on:
  push:
    tags: ["server-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - run: go vet ./... && go test ./...
      - name: Build
        run: |
          VER="${GITHUB_REF_NAME:-dev}"
          mkdir -p dist
          for ARCH in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$ARCH go build -trimpath \
              -ldflags "-s -w -X main.version=$VER" -o dist/oversee-linux-$ARCH ./cmd/oversee
            (cd dist && sha256sum oversee-linux-$ARCH > oversee-linux-$ARCH.sha256)
          done
          cp install.sh dist/install.sh
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "Server $GITHUB_REF_NAME" --notes "oversee gate manager" \
            || gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
