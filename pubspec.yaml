name: oversea
description: "Oversea — multi-protocol tunnel client with config management and locked configs."
publish_to: "none"

# App version. For Google Play, bump the build number (after +) on every upload.
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # رمزنگاری برای سیستم قفلِ کانفیگ (AES-GCM + HMAC برای کلیدِ چرخشیِ روزانه).
  cryptography: ^2.7.0
  # گرفتنِ ساب و فیدِ کانفیگ‌های رایگان از سرور.
  http: ^1.2.2
  # ذخیره‌ی محلیِ کانفیگ‌های کاربر روی دستگاه.
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
