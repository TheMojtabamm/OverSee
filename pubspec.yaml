name: oversea
description: "Oversea — multi-protocol tunnel client with config management and locked configs."
publish_to: "none"

# App version. For Google Play, bump the build number (after +) on every upload.
version: 1.0.0-beta.1+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # رمزنگاری برای سیستم قفلِ کانفیگ (AES-GCM + HMAC برای کلیدِ چرخشیِ روزانه).
  cryptography: ^2.7.0
  # ذخیره‌ی محلیِ کانفیگ‌های کاربر روی دستگاه.
  shared_preferences: ^2.3.2
  # اشتراک‌گذاری فایل/متن (Telegram و...) — requires compileSdk 34+ in CI.
  share_plus: ^7.2.2
  # Open telegram/web links (ad/channel preview).
  url_launcher: ^6.3.0
  # QR code for sharing plain (unlocked) configs.
  qr_flutter: ^4.1.0
  # Ads (shown after a successful connect).
  google_mobile_ads: ^5.1.0
  # Configs are stored in the Android Keystore-backed secure storage, not in
  # plain SharedPreferences.
  flutter_secure_storage: ^9.2.2
  # Pick a locked .ovsea file to import.
  file_picker: ^8.1.2

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
